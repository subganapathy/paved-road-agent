# One file configures a deployment: the proxy's slots and limits, and the
# agent-side settings. Credentials are never values here, only sources:
#   none | env:NAME | keychain:SERVICE   (keychain = the operator's macOS Keychain, laptop only)
# Copy to proxy.yaml (gitignored) and fill in.

listen: "127.0.0.1:8471"
token: keychain:paved-proxy-token        # the sandbox pod presents this; hack/sandbox/up.sh generates it

fleet:
  cluster_label: cluster
  clusters:
    - {id: e5-client, env: dev}
    - {id: e5-server, env: dev}
slots:
  metrics:
    kind: promql
    endpoint: http://127.0.0.1:9091      # port-forwarded from the kind cluster in M2
    auth: none
  dns:
    enabled: true
    resolver: 127.0.0.1:15353             # the programmed DNS clients use, exposed on the laptop
  scm:
    kind: github
    org: smallStepGiantLeap
    auth: keychain:github-token          # fine-grained token: contents, metadata, pull requests (read)
    allow_bot_commits: []                # repositories where the bot may push to a PR branch (M5)

limits:
  query_range_max: 168h
  result_bytes_max: 262144
  calls_per_session_max: 60
  tarball_bytes_max: 209715200

agent:
  api_key: keychain:anthropic-managed-agent
  environment_id: "env_016pzf5ygYnGdRMqrPcTWvhJ"
  environment_key: keychain:anthropic-env-key
  proxy: http://127.0.0.1:8471           # where the worker reaches the proxy
  workdir: /tmp/paved-road-agent/work-e5
  budget_usd: 3
