# The server cluster: hello, reachable from outside the cluster through a
# NodePort Service — the declaration a cross-cluster path starts from.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hello, namespace: hello}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels: {app: hello}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello}}
  template:
    metadata:
      labels: {app: hello}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9090"}
    spec:
      serviceAccountName: hello
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hello
          image: ghcr.io/smallstepgiantleap/hello@sha256:d4a9554cd0f115f10d593deb34dd6cbeadbbd1413127c902c696564078904901
          args: ["-drain-delay=2s", "-drain-spread=2s", "-shutdown-timeout=10s"]
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: metrics, containerPort: 9090}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  type: NodePort                       # exposed on every node of this cluster for callers outside it
  selector: {app: hello}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc, nodePort: 30051, appProtocol: grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-external
  namespace: monitoring
spec:
  type: NodePort                       # so the client cluster's Prometheus can scrape this cluster's state
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: http-metrics, port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-metrics-external
  namespace: hello
spec:
  type: NodePort
  selector: {app: hello}
  ports:
    - {name: metrics, port: 9090, targetPort: metrics, nodePort: 30090}
