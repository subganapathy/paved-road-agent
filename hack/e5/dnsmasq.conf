# The programmed DNS: the server's name answers with the appliance's
# address — the way clients learn where to go. The client cluster's
# CoreDNS forwards this zone here; the proxy's dns connector resolves
# against it, so the reviewer sees what the client sees.
no-resolv
server=8.8.8.8
address=/api.e5.internal/172.18.0.10
log-queries
