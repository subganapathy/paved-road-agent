# One Prometheus for the whole E5 fleet, in the client cluster: its own
# pods and state, the server cluster's state through a NodePort, and the
# appliance's Envoy stats. Each series carries `cluster` (or, for the
# appliance, component=appliance and no cluster — it is not in one).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: kube-state-metrics, action: drop}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __address__], regex: "(\\d+);([^:]+)(?::\\d+)?", replacement: "$2:$1", target_label: __address__}
          - {action: labelmap, regex: __meta_kubernetes_pod_label_(.+)}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
          - {target_label: cluster, replacement: e5-client}
      - job_name: kube-state-metrics
        honor_labels: true
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [monitoring]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: kube-state-metrics, action: keep}
          - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: "8080", action: keep}
          - {target_label: cluster, replacement: e5-client}
      - job_name: kube-state-metrics-e5-server
        honor_labels: true
        static_configs:
          - targets: ["172.18.0.8:30080"]
            labels: {cluster: e5-server}
      - job_name: hello-e5-server
        static_configs:
          - targets: ["172.18.0.8:30090"]
            labels: {cluster: e5-server, namespace: hello, app: hello}
      - job_name: appliance
        metrics_path: /stats/prometheus
        static_configs:
          - targets: ["172.18.0.10:9901"]
            labels: {component: appliance, appliance: e5-appliance}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: prometheus}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: monitoring}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=12h", "--storage.tsdb.path=/prometheus"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
